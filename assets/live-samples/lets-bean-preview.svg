  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#120b08"/>
      <stop offset="0.55" stop-color="#3a1f12"/>
      <stop offset="1" stop-color="#7a411e"/>
    </linearGradient>
